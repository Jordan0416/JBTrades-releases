<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JBTrades — Shared Trades</title>
<style>
  :root { --bg:#000; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12); --dim:rgba(255,255,255,.55); --dimmer:rgba(255,255,255,.35); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:#fff; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:32px 20px 60px; }
  .wrap { max-width:1000px; margin:0 auto; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:26px; flex-wrap:wrap; }
  .logo { width:44px; height:44px; border-radius:11px; background:#fff; color:#000; display:grid; place-items:center; font-weight:900; font-size:15px; letter-spacing:-.5px; }
  h1 { font-size:22px; font-weight:800; letter-spacing:-.3px; }
  .sub { color:var(--dimmer); font-size:12px; }
  .live { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--dim); }
  .dot { width:8px; height:8px; border-radius:50%; background:#fff; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.3; transform:scale(.7)} }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:26px; }
  .stat { background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.04)); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .stat .k { font-size:11px; font-weight:700; letter-spacing:1px; color:var(--dim); text-transform:uppercase; }
  .stat .v { font-size:24px; font-weight:900; margin-top:4px; font-variant-numeric:tabular-nums; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--dimmer); padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  td { padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.05); font-size:14px; vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  tr { transition:background .15s; }
  tbody tr:hover { background:rgba(255,255,255,.04); }
  .badge { display:inline-block; font-size:11px; font-weight:900; padding:3px 9px; border-radius:99px; }
  .jordan { background:#fff; color:#000; }
  .ben { background:rgba(255,255,255,.18); color:#fff; }
  .buy { color:#fff; font-weight:800; }
  .sell { color:var(--dim); font-weight:800; }
  .num { font-variant-numeric:tabular-nums; }
  .pl-up { background:#fff; color:#000; font-weight:800; padding:2px 8px; border-radius:8px; font-size:12px; }
  .pl-down { background:rgba(255,255,255,.12); color:var(--dim); font-weight:800; padding:2px 8px; border-radius:8px; font-size:12px; }
  .thesis { color:var(--dim); font-size:12px; max-width:320px; }
  .muted { color:var(--dimmer); font-size:12px; }
  .empty { padding:48px; text-align:center; color:var(--dimmer); }
  footer { margin-top:18px; color:var(--dimmer); font-size:11px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  @media (max-width:700px){ .thesis{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">JB</div>
    <div>
      <h1>JBTrades — Shared Trades</h1>
      <div class="sub">Jordan &amp; Ben · one paper account · every trade, live</div>
    </div>
    <div class="live"><span class="dot"></span>LIVE · refreshes every 15s</div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="card">
    <table>
      <thead>
        <tr><th>When</th><th>Who</th><th>Side</th><th>Trade</th><th>Price</th><th>Source</th><th>Thesis / Lesson</th><th>P/L</th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>

  <footer>
    <span>Alpaca paper account · trades recorded by the JBTrades app</span>
    <span id="updated"></span>
  </footer>
</div>

<script>
const URL_BASE = "https://iqqfxzxvwfsuwqoocugh.supabase.co/rest/v1/shared_trades";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxcWZ4enh2d2ZzdXdxb29jdWdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNDQzNjksImV4cCI6MjEwMjkyMDM2OX0.CKmgeK7JUZHZYtWDA0jfMwFC5n3ZCHlSzyczHt9X_mQ";

const money = v => v == null ? "" : "$" + Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = v => (v >= 0 ? "+" : "") + (v*100).toFixed(2) + "%";
const who = e => e.toLowerCase().startsWith("shamusjordan") ? "Jordan" : "Ben";

async function load() {
  try {
    const res = await fetch(`${URL_BASE}?select=*&order=created_at.desc&limit=200`, { headers: { apikey: ANON } });
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    render(rows);
    document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("rows").innerHTML = `<tr><td colspan="8" class="empty">Couldn't load trades (${e.message}) — retrying…</td></tr>`;
  }
}

function render(rows) {
  const closed = rows.filter(r => r.pl_percent != null);
  const wins = closed.filter(r => r.pl_percent >= 0);
  const avg = closed.length ? closed.reduce((s,r)=>s+r.pl_percent,0)/closed.length : 0;
  const jn = rows.filter(r => who(r.email)==="Jordan").length;
  const bn = rows.length - jn;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="k">Total trades</div><div class="v">${rows.length}</div></div>
    <div class="stat"><div class="k">Closed · Win rate</div><div class="v">${closed.length} · ${closed.length?Math.round(wins.length/closed.length*100)+"%":"—"}</div></div>
    <div class="stat"><div class="k">Avg P/L per close</div><div class="v">${closed.length?pct(avg):"—"}</div></div>
    <div class="stat"><div class="k">Jordan · Ben</div><div class="v">${jn} · ${bn}</div></div>`;

  if (!rows.length) {
    document.getElementById("rows").innerHTML = `<tr><td colspan="8" class="empty">No trades yet — they appear here the moment either app trades.</td></tr>`;
    return;
  }
  document.getElementById("rows").innerHTML = rows.map(r => {
    const w = who(r.email);
    const d = new Date(r.created_at);
    const note = r.lesson || r.thesis || "";
    return `<tr>
      <td class="muted num">${d.toLocaleDateString(undefined,{month:"short",day:"numeric"})} ${d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}</td>
      <td><span class="badge ${w==="Jordan"?"jordan":"ben"}">${w}</span></td>
      <td class="${r.side==="buy"?"buy":"sell"}">${r.side.toUpperCase()}</td>
      <td class="num"><b>${r.quantity} ${r.symbol}</b></td>
      <td class="num muted">${money(r.price)}</td>
      <td class="muted">${r.source||""}</td>
      <td class="thesis">${note.replace(/</g,"&lt;")}</td>
      <td>${r.pl_percent!=null?`<span class="${r.pl_percent>=0?"pl-up":"pl-down"}">${pct(r.pl_percent)}</span>`:""}</td>
    </tr>`;
  }).join("");
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
